<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cosmic" x1="54" y1="42" x2="1140" y2="285" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FF8A4C"/>
    </linearGradient>
    <radialGradient id="void" cx="0" cy="0" r="1" gradientTransform="translate(1002 157) rotate(90) scale(84)">
      <stop stop-color="#030308"/>
      <stop offset="0.65" stop-color="#030308"/>
      <stop offset="0.8" stop-color="#24134C"/>
      <stop offset="1" stop-color="#FF8A4C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#12172A" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="8" fill="#05050A"/>
  <rect width="1200" height="330" rx="8" fill="url(#grid)"/>

  <g fill="#DCE7FF">
    <circle cx="84" cy="84" r="1" opacity=".55"/><circle cx="188" cy="42" r="1.5" opacity=".32"/>
    <circle cx="336" cy="76" r="1" opacity=".45"/><circle cx="506" cy="44" r="1.3" opacity=".6"/>
    <circle cx="660" cy="82" r="1" opacity=".4"/><circle cx="796" cy="42" r="1.4" opacity=".48"/>
    <circle cx="1126" cy="78" r="1" opacity=".6"/><circle cx="1148" cy="272" r="1.4" opacity=".4"/>
    <circle cx="768" cy="278" r="1" opacity=".52"/><circle cx="536" cy="294" r="1.3" opacity=".35"/>
    <circle cx="292" cy="284" r="1" opacity=".5"/><circle cx="122" cy="250" r="1.4" opacity=".35"/>
  </g>

  <path d="M0 270C140 235 190 290 330 256C470 222 520 276 650 246C790 214 850 264 980 230C1080 204 1130 226 1200 208" stroke="url(#cosmic)" stroke-width="2" opacity=".28"/>
  <path d="M0 270C140 235 190 290 330 256C470 222 520 276 650 246C790 214 850 264 980 230C1080 204 1130 226 1200 208" stroke="url(#cosmic)" stroke-width="2" stroke-dasharray="10 18" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-112" dur="3s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(1002 157)">
    <ellipse rx="92" ry="30" fill="none" stroke="#3D2D72" stroke-width="1" stroke-dasharray="2 8"/>
    <ellipse rx="70" ry="22" fill="none" stroke="#8B5CF6" stroke-width="1" opacity=".45" transform="rotate(-18)">
      <animateTransform attributeName="transform" type="rotate" from="-18 0 0" to="342 0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="34" fill="url(#void)"/>
    <circle r="25" fill="#030308" stroke="#161326" stroke-width="7"/>
    <circle r="31" fill="none" stroke="#FF8A4C" stroke-width="2" stroke-dasharray="20 34" opacity=".9">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-70" cy="-18" r="5" fill="#22D3EE" filter="url(#glow)">
      <animateMotion dur="9s" repeatCount="indefinite" path="M 70 0 A 92 30 0 1 1 -70 0 A 92 30 0 1 1 70 0"/>
    </circle>
  </g>

  <g font-family="monospace">
    <text x="60" y="54" fill="#77738D" font-size="14">ARYAN.RAJ / DEEP SPACE BUILD LOG / 2026</text>
    <circle cx="1086" cy="48" r="6" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1102" y="54" fill="#22D3EE" font-size="13">ONLINE</text>

    <text x="58" y="137" fill="#F5F5FF" font-size="66" font-weight="700">ARYAN RAJ</text>
    <text x="62" y="174" fill="#B8B8C8" font-size="19">Electrical Engineering · IIT Mandi</text>
    <text x="62" y="215" fill="url(#cosmic)" font-size="17">Python  /  C++  /  FastAPI  /  Next.js  /  React</text>
    <text x="62" y="246" fill="#A78BFA" font-size="16">RAG  ·  GenSI  ·  LangChain</text>

    <text x="820" y="286" fill="#77738D" font-size="12">ORBITAL STATUS</text>
    <text x="820" y="306" fill="#F5F5FF" font-size="17">BUILDING USEFUL THINGS</text>
    <text x="932" y="224" fill="#847E9F" font-size="10">BLACK HOLE / ACTIVITY WELL</text>
